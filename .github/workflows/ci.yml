name: CI Test Suite

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up GCC compiler
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Run Host Test Matrix
        run: |
          chmod +x tests/run_all_configs.sh
          ./tests/run_all_configs.sh
